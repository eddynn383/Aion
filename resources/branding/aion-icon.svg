<!-- Iconița aplicației Aion (conceptul „Axe”): trei axe dintr-un nod comun.
     Grila macOS: corpul de 824 × 824 în pânza de 1024, colțuri de 185. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23252B"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <!-- Umbra (fără filtre: QSvgRenderer citește SVG Tiny). -->
  <rect x="100" y="114" width="824" height="824" rx="185" fill="#000000" fill-opacity="0.18"/>
  <rect x="100" y="106" width="824" height="824" rx="185" fill="#000000" fill-opacity="0.18"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="url(#rim)" stroke-width="8"/>
  <!-- Marca, desenată în pătratul de 100 de unități al conceptului. -->
  <g transform="translate(100 100) scale(8.24)" stroke-linecap="round">
    <line x1="50" y1="56" x2="50" y2="20" stroke="#3B82F6" stroke-width="7"/>
    <line x1="50" y1="56" x2="80" y2="73" stroke="#EF4444" stroke-width="7"/>
    <line x1="50" y1="56" x2="20" y2="73" stroke="#22C55E" stroke-width="7"/>
    <circle cx="50" cy="56" r="9" fill="#F4F4F5"/>
  </g>
</svg>
