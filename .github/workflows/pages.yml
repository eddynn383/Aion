name: Publică versiunea web

# Pornit manual (Actions → „Publică versiunea web” → Run workflow), după ce un build CI a trecut.
# Necesită GitHub Pages activat cu sursa „GitHub Actions” (Settings → Pages).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID-ul rulării CI din care se ia artefactul aion-web"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aion-web
          path: web
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
