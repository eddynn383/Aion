name: Publică versiunea web

# Automat: după fiecare rulare CI reușită pe main, versiunea web (artefactul aion-web) se publică pe GitHub Pages.
# Manual: Actions → „Publică versiunea web” → Run workflow, cu ID-ul unei rulări CI (de exemplu pentru o revenire).
# Necesită GitHub Pages activat cu sursa „GitHub Actions” (Settings → Pages).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID-ul rulării CI din care se ia artefactul aion-web"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# O singură publicare odată; una nouă o înlocuiește pe cea în așteptare.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aion-web
          path: web
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
