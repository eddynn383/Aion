name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS (Debug, ASan + UBSan)
    runs-on: macos-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg

    steps:
      - uses: actions/checkout@v4

      - name: Instalează Ninja
        run: brew install ninja

      - name: Instalează Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          modules: qtshadertools
          cache: true

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Instalează vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configurare
        run: cmake --preset mac-debug -DAION_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset mac-debug

      - name: Teste
        run: ctest --preset mac-debug

  windows:
    name: Windows (MSVC, Debug)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Mediul MSVC (cl, Ninja în PATH)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalează Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-win-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-win-

      # vcpkg-ul de pe runner (și cel din Visual Studio, pus în VCPKG_ROOT de msvc-dev-cmd) e prea vechi pentru
      # baseline-ul din vcpkg.json: folosim o clonă proprie, setată în VCPKG_ROOT pentru pașii următori.
      - name: Instalează vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vcpkg-aion"
          git clone https://github.com/microsoft/vcpkg "$root"
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configurare
        run: cmake --preset win-debug

      # -k 0: toate erorile MSVC dintr-o rulare, nu doar prima.
      - name: Build
        run: cmake --build --preset win-debug -- -k 0

      - name: Teste
        run: ctest --preset win-debug

  wasm-core:
    name: WebAssembly (core + teste în Node)
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg

    steps:
      - uses: actions/checkout@v4

      - name: Instalează Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Instalează Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.10"

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-wasm-${{ hashFiles('vcpkg.json', 'triplets/wasm32-emscripten.cmake') }}
          restore-keys: vcpkg-wasm-

      - name: Instalează vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configurare
        run: cmake --preset wasm-core

      - name: Build
        run: cmake --build --preset wasm-core

      - name: Teste (Node)
        run: ctest --preset wasm-core

      - name: Mărimea bibliotecii
        run: ls -l build/wasm-core/core/libaion_core.a build/wasm-core/tests/aion_tests.*

  wasm-app:
    name: Web (aplicația completă, Qt for WebAssembly)
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg

    steps:
      - uses: actions/checkout@v4

      # Pe WebGL un bloc de uniforme declarat diferit în două shadere strică tot viewport-ul.
      - name: Blocul Frame identic în toate shaderele
        run: python3 tools/check_shader_blocks.py

      - name: Instalează Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Qt pentru WebAssembly are nevoie de Qt-ul desktop de aceeași versiune (unelte rulate la build: moc, qsb…).
      - name: Instalează Qt desktop (unelte de build)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true

      - name: Reține Qt-ul desktop ca QT_HOST_PATH
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Instalează Qt pentru WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: all_os
          target: wasm
          arch: wasm_singlethread
          modules: qtshadertools
          cache: true

      # Qt 6.10 cere Emscripten 4.0.7 (https://doc.qt.io/qt-6.10/wasm.html).
      - name: Instalează Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.7"

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-wasm-app-${{ hashFiles('vcpkg.json', 'triplets/wasm32-emscripten-qt.cmake') }}
          restore-keys: vcpkg-wasm-app-

      - name: Instalează vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configurare
        run: cmake --preset wasm-app

      - name: Build
        run: cmake --build --preset wasm-app

      - name: Pagina web (HTML + JS + WASM)
        run: |
          mkdir -p web
          cp build/wasm-app/app/Aion.html web/index.html
          cp build/wasm-app/app/Aion.js build/wasm-app/app/Aion.wasm build/wasm-app/app/qtloader.js web/
          cp resources/branding/aion-icon.svg web/ 2>/dev/null || true
          # Ecranul de încărcare al lui Qt cere qtlogo.svg: arătăm iconița Aion în locul lui.
          cp resources/branding/aion-icon.svg web/qtlogo.svg
          ls -l web

      - uses: actions/upload-artifact@v4
        with:
          name: aion-web
          path: web
